<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Softario</title>
    
    <!-- Link to the PyScript assets -->
    <link rel="stylesheet" href="https://pyscript.net" />
    <script type="module" src="https://pyscript.net"></script>
</head>
<body>

    <h1>Running Python in the Browser</h1>
    
    <!-- Your Python code goes here -->
    <script type="py">
        print("Hello from Python inside your HTML page!")
        
        # You can use standard Python logic
        for i in range(1, 4):
            print(f"Loop iteration: {i}")
    </script>

</body>
</html>
